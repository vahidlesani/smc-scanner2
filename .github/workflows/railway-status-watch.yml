name: Railway restore watcher (10m)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# The watcher runs on GitHub, not Railway, so it survives the Railway outage.
# actions:write is used only to disable this workflow after the one-time
# recovery message has been delivered.
permissions:
  contents: read
  actions: write

concurrency:
  group: railway-restore-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway's public incident oracle
        id: railway
        run: python3 ops/railway/watch_status.py --github-output "$GITHUB_OUTPUT"

      - name: Notify the private Telegram chat once
        if: steps.railway.outputs.ready == 'true'
        env:
          RAILWAY_STATUS_TELEGRAM_TOKEN: ${{ secrets.RAILWAY_STATUS_TELEGRAM_TOKEN }}
          RAILWAY_STATUS_CHAT_ID: ${{ secrets.RAILWAY_STATUS_CHAT_ID }}
        run: python3 ops/railway/watch_status.py --notify-ready

      - name: Disable watcher after successful notification
        if: steps.railway.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_ID: railway-status-watch.yml
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPOSITORY"]
          workflow = os.environ["WORKFLOW_ID"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/disable"
          request = urllib.request.Request(
              url,
              data=b"{}",
              method="PUT",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "viva-railway-status-watch/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError(f"unexpected disable status {response.status}")
          print("Watcher disabled: the restore alert will not repeat.")
          PY
