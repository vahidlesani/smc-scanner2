name: sample-klines

# R31.7: commit a small real-OHLCV sample back to the review branch so the
# (exchange-blocked) dev sandbox can debug charts/detectors on real candles.
on:
  push:
    branches: ["arena/**"]
    paths:
      - "experiments/sample_klines.py"
      - ".github/workflows/sample-klines.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - run: PYTHONPATH=. python experiments/sample_klines.py BTCUSDT,ETHUSDT,SOLUSDT,SUIUSDT
      - name: commit sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f experiments/sample_klines/*.csv.gz
          git commit -m "data: real OHLCV sample for local chart/detector debugging [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
