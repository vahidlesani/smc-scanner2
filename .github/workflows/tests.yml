name: tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pyflakes
      - run: python -m compileall -q .
      - id: pytest
        continue-on-error: true
        run: |
          python -m pytest tests/ -q > pytest.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Report pytest failure
        if: steps.pytest.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('pytest.log', 'utf8');
            const tail = log.slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### R30 pytest failure diagnostic\n\n```text\n" + tail + "\n```"
            });
      - name: Fail if pytest failed
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
      - run: python -m pyflakes analysis/execution_integrity_r28.py
