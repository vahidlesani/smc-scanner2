name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pyflakes
      - run: python -m compileall -q .
      - run: |
          set +e
          python -m pytest tests/ -q > pytest.log 2>&1
          status=$?
          cat pytest.log
          exit $status
      - run: python -m pyflakes analysis/execution_integrity_r28.py
